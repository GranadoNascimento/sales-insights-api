[project]
name = "sales-insights-api"
version = "1.1.0"
description = "API de insights de vendas com RAG sobre banco relacional (FastAPI + SQLAlchemy + LangChain)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: testes de integração com PostgreSQL (precisam de TEST_POSTGRES_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
