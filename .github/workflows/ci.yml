name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Testes unitários (SQLite + LLM falso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m "not postgres"

  integration:
    name: Testes de integração (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: sales
          POSTGRES_DB: sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales -d sales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sales
      TEST_POSTGRES_URL: postgresql+psycopg2://sales_reader:sales_reader@localhost:5432/sales
      TEST_POSTGRES_ADMIN_URL: postgresql+psycopg2://sales:sales@localhost:5432/sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Carrega o banco (esquema, dados e usuário somente leitura)
        run: |
          psql -h localhost -U sales -d sales -v ON_ERROR_STOP=1 -q -f db/01_init.sql
          psql -h localhost -U sales -d sales -v ON_ERROR_STOP=1 -q -f db/02_readonly_user.sql
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m postgres

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose.yml
        run: docker compose config -q
      - run: docker build -t sales-insights-api .
      - name: Confere que a imagem roda sem root
        run: test "$(docker run --rm --entrypoint whoami sales-insights-api)" = "appuser"
